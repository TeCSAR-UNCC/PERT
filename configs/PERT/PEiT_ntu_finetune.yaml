
# Training settings
epochs: 20
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-6
max_learning_rate: 1.0e-4
coeff_step_size_up: 2
coeff_step_size_down: 5
weight_decay: 0.05 # Learning rate decay
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: 8
device: 'cuda'
world_size: 2
num_workers: 8

#NOTE: Not sure what it is.
transparent: true 

deepspeed: true
distributed_backend: true

# Dataset Settings
DATASET:
  train_dataset: 'action_nturgbd'
  test_dataset: 'action_nturgbd'
  root: '/mnt/DATASETS_RAID_28TB/nturgbd/'
  window_size: &dws 300 # Dataset Window Size
  frame_interval: 1
  stride: 1
  joint_req: 0.9
  test_subset: 'validation'
  train_subset: 'train'
  camera_num: 10
  training_mode: 'fine-tuning'
  resolution: [1920, 1080]
  num_classes: 120

  # Heatmap Generator
  Heatmap_Generator:
    use_gaussian_score: false
    with_limb: true
    with_kp: false
    heatmap_size: &hms 256 # Heatmap Size
    scaling: 1.0


Pretrained_Models:
  discrete_vae_weight_path: './saved_models/vae.pt'
  PERT:
    pretrain_saved_file: './saved_models/beit_best.pt'
    finetune_saved_file: './saved_models/beit_finetune_best.pt'

PERT:
  window_size:
    - 0
    - 0
  num_mask_patches: 204
  max_mask_patches_per_block: null
  min_mask_patches_per_block: 16