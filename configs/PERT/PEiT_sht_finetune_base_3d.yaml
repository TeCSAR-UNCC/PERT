# Training settings
epochs: 2
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-8
max_learning_rate: 1.0e-4
coeff_step_size_up: 15
coeff_step_size_down: 5
weight_decay: 0.0003
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bs 16
device: "cuda:0"
world_size: 1
num_workers: 0
repeated_size_of_dataset: 10joint_reduction and embed
extra_project_name: "set120"

#NOTE: Not sure what it is.
transparent: true

deepspeed: false
distributed_backend: true

# Dataset Settings
DATASET:
  # train_dataset: "CPCC"
  # test_dataset: "CPCC"
  train_dataset: "ShanghaiTech"
  test_dataset: "ShanghaiTech"
  window_size: &dws 48 # Dataset Window Size
  stride: 24
  second_heatmap: &dVAE_heatmap_size null
  # num_classes: 9
  num_classes: 18
  joint_number: &jn 17
  data_dir: "/home/galinezh/PERT/data"
  resolution: (856, 480)
  # resolution: (1280, 720)
  specific_clip: None
  # mask_root: "/home/galinezh/PERT/data/CPCC/gt/test_frame_mask/"
  mask_root: "/home/galinezh/PERT/data/ShanghaiTech/gt/test_frame_mask/"
  save_results: false
  save_results_dir: "/test/"

  Heatmap_Generator:
    # You need to also update `mmcv_config` if you change this value to something else.
    heatmap_size: 72
    joint_reduction: &cj false

Pretrained_Models:
  discrete_vae_weight_path: ""
  pretrain_saved_file: "/home/galinezh/saved_models/current/RUN1_3DdVAE_HEATMAP_BASE_3DResBlock_Super_Serenity/beit_best_firm-wood-3_pretraining.pt"

PeIT:
  model: "beit_base"
  finetune_checkpoint: 'None'
