# Training settings
epochs: 20
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-6
max_learning_rate: 1.0e-3
coeff_step_size_up: 5
coeff_step_size_down: 14
weight_decay: 0.05 # Learning rate decay
starting_temp: .6 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bts 8
device: 'cuda'
world_size: 2
num_workers: *bts

#NOTE: Not sure what it is.
transparent: true 

deepspeed: true
distributed_backend: true
                                                             

# Dataset Settings
DATASET:
  train_dataset: 'panoptic'
  test_dataset: 'panoptic'
  root: '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
  # Dataset Window Size
  window_size: &dws 300
  frame_interval: 1
  stride: 300
  joint_req: 0.9
  test_subset: 'validation'
  train_subset: 'train'
  camera_num: 10
  #"d_vae", "peit" or "fine-tuning"
  training_mode: 'peit'
  resolution: [1920, 1080]
  drop_frames_rate: 0.1
  # Some of the NTU video have just around 1 second.
  max_num_frame_rate: 0.9
  pad_last_frame: False
  second_heatmap_size: &scnd_heatmap_size null

  # Heatmap Generator
  Heatmap_Generator:
    use_gaussian_score: false
    with_limb: true
    with_kp: false
    heatmap_size: &hms 128 # Heatmap Size
    scaling: 1.0

# Model Settings
VAE_Params:
  image_size: *hms
  num_layers: 3 # Number of layers (should be 3 or above)
  num_tokens: 8192 # Number of image tokens
  codebook_dim: 512
  hidden_dim: 256
  channels: *dws
  num_resnet_blocks: 4 # Number of residual net blocks
  smooth_l1_loss: true
  kl_div_loss_weight: 0.0
  normalization: null
  use_SiLU: False

Pretrained_Models:
    discrete_vae_weight_path: './saved_models/vae_300_panoptic_cheerful-goat-7.pt'
    prefix_saved_file: ''

PeIT:
  window_size:
    - 0
    - 0
  num_mask_patches: 0.1
  max_mask_patches_per_block: 0.2
  min_mask_patches_per_block: 0.1