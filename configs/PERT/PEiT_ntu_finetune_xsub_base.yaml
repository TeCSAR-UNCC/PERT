
# Training settings
epochs: 25
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-8
max_learning_rate: 1.0e-4
coeff_step_size_up: 1
coeff_step_size_down: 24
weight_decay: 0.0003
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bs 16
device: 'cuda'
world_size: 2
num_workers: 4
repeated_size_of_dataset: 10

#NOTE: Not sure what it is.
transparent: true 

deepspeed: true
distributed_backend: true

# Dataset Settings
DATASET:
  train_dataset: 'ntu_mmcv'
  test_dataset: 'ntu_mmcv'
  window_size: &dws 48 # Dataset Window Size
  second_heatmap: &dVAE_heatmap_size null
  num_classes: 120
  mmcv_config: 'configs/nturgbd/ntu120_limb_xsub.py'

  Heatmap_Generator:
    # You need to also update `mmcv_config` if you change this value to something else.
    heatmap_size: 256
    joint_reduction: &cj true


Pretrained_Models:
  discrete_vae_weight_path: ''
  pretrain_saved_file: '/mnt/DATASETS_RAID_28TB/saved_models/current/RUN1_HEATMAP_ResBlock_BASE/beit_best_peach-lake-23_pretraining.pt'


PeIT:
  model: 'beit_base_patch16_224'
  finetune_checkpoint: '/mnt/DATASETS_RAID_28TB/saved_models/current/NTU_RUN1_PreTrained_base_Learning_peach_lake_23_ResBlock'
  checkpoint_root_folder: '/mnt/DATASETS_RAID_28TB/saved_models/current'
  custom_run_name: 'NTU_RUN2_PreTrained_base_Learning_peach_lake_23_ResBlock'
  embed_2dpatch: *cj
  window_size:
    - 0
    - 0
  num_mask_patches: 204
  max_mask_patches_per_block: null
  min_mask_patches_per_block: 16