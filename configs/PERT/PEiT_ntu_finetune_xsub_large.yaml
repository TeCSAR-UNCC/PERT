anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-8
max_learning_rate: 1.0e-4
coeff_step_size_up: 0.2
coeff_step_size_down: 20
weight_decay: 0.3 # Weight rate decay
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bs 16
device: 'cuda'
world_size: 2
num_workers: *bs
repeated_size_of_dataset: 10

