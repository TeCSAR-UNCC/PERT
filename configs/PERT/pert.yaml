
# Training settings
epochs: 20
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-6
max_learning_rate: 1.0e-4
coeff_step_size_up: 0.5
coeff_step_size_down: 2
weight_decay: 0.1 # Learning rate decay
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: 8
device: 'cuda'

#NOTE: Not sure what it is.
transparent: true 

# Clean up 
deepspeed: true
distributed_backend: true

# Heatmap Generator
Heatmap_Generator:
  use_gaussian_score: false
  with_limb: true
  with_kp: false
  heatmap_size: &hms 256 # HeatMap Size
                                                                     

# Dataset Settings
DATASET:
  train_dataset: 'panoptic'
  test_dataset: 'panoptic'
  root: '/home/mbaharan/'
    #panoptic: '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
    #nturgbd: '/mnt/DATASETS_RAID_28TB/nturgbd/'
  window_size: &dws 300 # Dataset Window Size
  frame_interval: 1
  stride: 1
  test_subset: 'validation'
  train_subset: 'train'
  rootIDX: 1
  camera_num: 10
  training_mode: 'pert'

# Model Settings
VAE_Params:
  image_size: *hms
  num_layers: 4 # Number of layers (should be 3 or above)
  num_tokens: 8192 # Number of image tokens
  codebook_dim: 512
  hidden_dim: 256
  channels: *dws
  num_resnet_blocks: 2 # Number of residual net blocks
  smooth_l1_loss: true
  kl_div_loss_weight: 0.0
  normalization: null

Pretrained_Models:
  discrete_vae_weight_path: './saved_models/vae.pt'
  PERT:
    path_folder: './saved_models/pert/'
    prefix_saved_file: 'pert_iter_{}.pt'

PERT:
  window_size:
    - 0
    - 0
  num_mask_patches: 75
  max_mask_patches_per_block: null
  min_mask_patches_per_block: 16
