# Training settings
epochs: 50
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-8
max_learning_rate: 1.5e-4
coeff_step_size_up: 1
coeff_step_size_down: 49
weight_decay: 0.05 # Learning rate decay
starting_temp: 1.0 # Starting temperature
temp_min: 0.46165 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bts 12
device: 'cuda'
world_size: 3
num_workers: 8
gradient_clipping: 3
fp16_training: True
wandb_log_dir: '/mnt/DATASETS_RAID_28TB/WAND_B/current/'

#NOTE: Not sure what it is.
transparent: true 

deepspeed: true
distributed_backend: true
                                                             

# Dataset Settings
DATASET:
  train_dataset: 'panoptic'
  test_dataset: 'panoptic'
  root: '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
  window_size: &dws 48 # Dataset Window Size
  frame_interval: 1
  stride: 30
  joint_number: &jn 17
  joint_req: 0.9
  test_subset: 'validation'
  train_subset: 'train'
  camera_num: 10
  #"d_vae", "peit" or "fine-tuning"
  training_mode: 'peit'
  resolution: [1920, 1080]
  drop_frames_rate: 0.3
  # Some of the NTU video have just around 1 second.
  max_num_frame_rate: 0.9
  linear_interpolate: False

  # Heatmap Generator
  Heatmap_Generator:
    use_gaussian_score: false
    with_limb: true
    with_kp: false
    heatmap_size: &hms 256 # Heatmap Size
    scaling: 1.0
    joint_reduction: &cj false

# Model Settings
VAE_Params:
  image_size: *hms
  num_layers: 4 # Number of layers (should be 3 or above)
  num_tokens: 8096 # Number of image tokens
  codebook_dim: 512
  hidden_dim: 256
  channels: *jn
  num_resnet_blocks: 1 # Number of residual net blocks
  smooth_l1_loss: true
  normalization: null
  use_SiLU: True

Pretrained_Models:
    discrete_vae_weight_path: '/mnt/DATASETS_RAID_28TB/saved_models/vae_48_panoptic_jumping-durian-23.pt'
    prefix_saved_file: ''

PeIT:
  model: 'beit_nano_patch16'
  finetune_checkpoint: ''
  checkpoint_root_folder: '/mnt/DATASETS_RAID_28TB/saved_models/current'
  custom_run_name: 'RUN1_3DdVAE_HEATMAP_NANO'
  embed_2dpatch: *cj
  window_size:
    - 0
    - 0
  num_mask_patches: 0.4
  max_mask_patches_per_block: 0.4
  min_mask_patches_per_block: 0.2