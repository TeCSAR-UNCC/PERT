
# Training settings
epochs: 20
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 0.000001 # Temperature annealing rate
base_learning_rate: 1.0e-6
max_learning_rate: 1.5e-4
coeff_step_size_up: 1
coeff_step_size_down: 3
weight_decay: 0.05 # Learning rate decay
starting_temp: 1.0 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: 8 
device: 'cuda'
world_size: 1

#NOTE: Not sure what it is.
transparent: true 

deepspeed: true
distributed_backend: true
                                                             

# Dataset Settings
DATASET:
  train_dataset: 'pan_ntu'
  test_dataset: 'pan_ntu'
  root: # '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
    panoptic: '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
    nturgbd: '/mnt/DATASETS_RAID_28TB/nturgbd/'
  window_size: &dws 300 # Dataset Window Size
  frame_interval: 1
  stride: 15
  joint_req: 0.9
  test_subset: 'validation'
  train_subset: 'train'
  camera_num: 10
  training_mode: 'pert'
  resolution: [1920, 1080]
  drop_frames_rate: 0.3
  # Some of the NTU video have just around 1 second.
  max_num_frame_rate: 0.9

  # Heatmap Generator
  Heatmap_Generator:
    use_gaussian_score: false
    with_limb: true
    with_kp: false
    heatmap_size: &hms 128 # Heatmap Size
    scaling: 1.0

# Model Settings
VAE_Params:
  image_size: *hms
  num_layers: 3 # Number of layers (should be 3 or above)
  num_tokens: 8192 # Number of image tokens
  codebook_dim: 512
  hidden_dim: 256
  channels: *dws
  num_resnet_blocks: 2 # Number of residual net blocks
  smooth_l1_loss: true
  kl_div_loss_weight: 0.0
  normalization: null

Pretrained_Models:
  discrete_vae_weight_path: './saved_models/vae.pt'
  PERT:
    prefix_saved_file: '/mnt/DATASETS_RAID_28TB/saved_models/beit_best.pt'

PeIT:
  window_size:
    - 0
    - 0
  num_mask_patches: 204
  max_mask_patches_per_block: null
  min_mask_patches_per_block: 16