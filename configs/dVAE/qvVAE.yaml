# Training settings
epochs: &ep 20
#Not used for `triangular2` cyclic!
lr_decay: 0.99
anneal_rate: 1.0e-6 # Temperature annealing rate
base_learning_rate: 1.0e-6
max_learning_rate: 1.0e-4
coeff_step_size_up: 1
coeff_step_size_down: 19
weight_decay: 0.05 # Learning rate decay
starting_temp: 0.9 # Starting temperature
temp_min: 0.5 # Minimum temperature to anneal to
num_images_save: 4 # Number of images to save
batch_size: &bts 16
device: 'cuda'
world_size: 2
num_workers: *bts
second_heatmap_size: &scnd_heatmap_size null
gradient_clipping: 0


deepspeed: true
distributed_backend: true
                                                             

# Dataset Settings
DATASET:
  train_dataset: 'panoptic'
  test_dataset: 'panoptic'
  root: '/mnt/DATASETS_RAID_28TB/panoptic-toolbox/data/'
  window_size: &dws 48 # Dataset Window Size
  frame_interval: 1
  stride: 150
  joint_req: 0.9
  test_subset: 'validation'
  train_subset: 'train'
  camera_num: 10
  #"d_vae", "peit" or "fine-tuning"
  training_mode: 'd_vae'
  resolution: [1920, 1080]
  drop_frames_rate: 0.3
  # Some of the NTU video have just around 1 second.
  max_num_frame_rate: 0.9
  linear_interpolate: False

  # Heatmap Generator
  Heatmap_Generator:
    use_gaussian_score: true
    with_limb: true
    with_kp: false
    heatmap_size: &hms 256 # Heatmap Size
    scaling: 1.0

# Model Settings
VAE_Params:
  image_size: *hms
  num_layers: 4 # Number of layers (should be 3 or above)
  num_tokens: 4096 # Number of image tokens
  codebook_dim: 512
  hidden_dim: 512
  channels: *dws
  num_resnet_blocks: 1 # Number of residual net blocks
  smooth_l1_loss: true
  commitment_weight: 1.0
  vq_decay: 0.1
  alpha: 1
  normalization: null
  use_SiLU: True
  

Resume:
  chk_ptn: ''
